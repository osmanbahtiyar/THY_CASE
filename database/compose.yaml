version: '3.8'
services:
  postgres:
    image: postgres:16.9
    container_name: thycase-postgres
    environment:
      POSTGRES_DB: thycase
      POSTGRES_USER: thycase
      POSTGRES_PASSWORD: thycase
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data: